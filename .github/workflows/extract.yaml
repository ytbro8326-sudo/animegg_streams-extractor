name: AnimeGG Stream Extractor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Extraction mode"
        required: true
        default: "single"
        type: choice
        options:
          - single
          - multiple
          - all
      mal_ids:
        description: "MAL ID(s) — single value or comma-separated (e.g. 20, 1735, 1535). Ignored if mode is 'all'."
        required: false
        default: ""

  schedule:
    - cron: "0 0 * * 0"  # every Sunday at midnight UTC

# Allow the workflow to write back to the repository
permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true  # needed for git push at the end

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore previously committed output from the repo itself.
      # The git checkout above already has it if it was committed; this step
      # ensures the output/ directory exists even on a fresh repo.
      - name: Ensure output directory exists
        run: mkdir -p output

      - name: Run extractor (single)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'single'
        run: |
          python - <<'EOF'
          import main
          main.run_single(int("${{ github.event.inputs.mal_ids }}".strip()))
          EOF

      - name: Run extractor (multiple)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'multiple'
        run: |
          python - <<'EOF'
          import main
          raw = "${{ github.event.inputs.mal_ids }}"
          mal_ids = [x.strip() for x in raw.split(',') if x.strip().isdigit()]
          main.run_multiple(mal_ids)
          EOF

      - name: Run extractor (all)
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'all'
        run: |
          python - <<'EOF'
          import main
          main.run_all()
          EOF

      - name: Upload output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: animegg-streams-${{ github.run_id }}
          path: output/
          retention-days: 90

      - name: Commit output back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/
          git diff --cached --quiet || git commit -m "chore: update extracted streams [run #${{ github.run_number }}]"
          git push
